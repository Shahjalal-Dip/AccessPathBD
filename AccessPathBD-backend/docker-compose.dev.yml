services:
  postgres:
    image: postgres:16-alpine
    container_name: accesspath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: imlalvai
      POSTGRES_DB: accesspath_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: accesspath-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
